<div class="container">
    <h1 class="mt-3"> Add Category</h1>

    <!-- 
      Angular reactive form 
      [formGroup] - Binds to the FormGroup in TypeScript
      (ngSubmit) - Event triggered when form is submitted
    -->

    <form [formGroup]="addCategoryFormGroup" (ngSubmit)="onSubmit()">
        <div class="mt-3">

            <div class="mt-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" formControlName="categoryName">
            </div>

            <!-- 
                  Input field bound to categoryName FormControl
                  formControlName connects this input to the FormControl in TS
            -->

            <div class="mt-3">
                <label class="form-label">URL Handle (Slug)</label>
                <input type="text" class="form-control" formControlName="categoryUrlHandle">
            </div>

            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </div>
    </form>
</div>
