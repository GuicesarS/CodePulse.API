<div class="container">
    <div class="my-5">
        @if (isLoading()) { 
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        } @else {
            <div class="row g-4"> 
                @for(blogPost of blogPostResponse(); track blogPost.id) {
                    <div class="col-12 col-md-4"> 
                        <div class="card h-100"> <img [src]="blogPost.featuredImageUrl" class="card-img-top" [alt]="blogPost.title"> <div class="card-body d-flex flex-column">
                                <h2 class="card-title">{{ blogPost.title }}</h2>
                                <p class="card-text">{{ blogPost.shortDescription }}</p>
                                <span class="d-flex align-items-end mt-auto" style="flex:1"> 
                                    <a [routerLink]="['/blog', blogPost.urlHandle]" class="btn btn-primary">Read More</a>
                                </span>
                            </div>
                        </div>
                    </div>
                }
            </div>
        }
    </div>
</div>
